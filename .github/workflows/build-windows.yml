name: Build Windows executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - run: pip install pyinstaller

    - run: pyinstaller --onefile --name GuessWho_AnimalVersion GuessWho_AnimalVersion.py

    - uses: actions/upload-artifact@v4
      with:
        name: GuessWho-AnimalVersion-Windows
        path: dist/GuessWho_AnimalVersion.exe